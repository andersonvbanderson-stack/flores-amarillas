<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yellow Matrix Heart with Snoopy & Stitch</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: radial-gradient(circle, #1a1503 0%, #000 80%); overflow: hidden; display: flex; justify-content: center; align-items: center; font-family: 'Montserrat', sans-serif; }
        #heartCanvas { position: absolute; inset: 0; z-index: 1; }
        .center-text { position: relative; z-index: 2; color: #fff; font-size: 4.5rem; font-weight: 800; letter-spacing: 3px; text-align: center; pointer-events: none; animation: pulse 2.5s infinite ease-in-out alternate; padding: 0 20px; }
        .character { position: absolute; bottom: 5%; width: 180px; z-index: 3; pointer-events: none; animation: float 4s infinite ease-in-out alternate; }
        .left-char { left: 5%; }
        .right-char { right: 5%; animation-direction: alternate-reverse; }
        @media (max-width: 768px) {
            .center-text { font-size: 2.2rem; }
            .character { width: 100px; bottom: 3%; }
            .left-char { left: 2%; } .right-char { right: 2%; }
        }
        @keyframes float { 0% { transform: translateY(0) rotate(-2deg); } 100% { transform: translateY(-15px) rotate(2deg); } }
        @keyframes pulse { 0% { transform: scale(0.96); opacity: 0.85; text-shadow: 0 0 15px rgba(255,255,255,0.8); } 100% { transform: scale(1.04); opacity: 1; text-shadow: 0 0 25px #fff, 0 0 40px #ffe600; } }
    </style>
</head>
<body>
    <img class="character left-char" src="https://pngimg.com/uploads/snoopy/snoopy_PNG22.png" alt="Snoopy">
    <img class="character right-char" src="https://pngimg.com/uploads/stitch/stitch_PNG2.png" alt="Stitch">
    <canvas id="heartCanvas"></canvas>
    <div class="center-text">FELIZ DÍA DE LAS FLORES AMARILLAS</div>

    <script>
        const canvas = document.getElementById('heartCanvas'), ctx = canvas.getContext('2d');
        const words = ["ERES CAPAZ", "ERES INTELIGENTE", "ERES VALIENTE", "ERES FUERTE"];
        const colors = ["rgba(255,215,0,", "rgba(255,239,0,", "rgba(255,193,7,", "rgba(218,165,32,", "rgba(255,253,208,"];
        let particles = [], roses = [], isMobile;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            isMobile = canvas.width < 768;
            init();
        }

        class Particle {
            constructor() {
                const t = Math.random() * Math.PI * 2;
                const scale = (isMobile ? 6 : 13) + Math.random() * 4;
                this.baseX = 16 * Math.pow(Math.sin(t), 3) * scale;
                this.baseY = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * scale;
                this.offsetX = (Math.random() - 0.5) * (isMobile ? 15 : 35);
                this.offsetY = (Math.random() - 0.5) * (isMobile ? 15 : 35);
                this.text = words[Math.floor(Math.random() * words.length)];
                this.baseColor = colors[Math.floor(Math.random() * colors.length)];
                this.fontSize = Math.floor(Math.random() * 4) + (isMobile ? 7 : 11);
                this.angle = Math.random() * Math.PI * 2;
                this.angleSpeed = 0.015 + Math.random() * 0.02;
                this.alpha = 0.4 + Math.random() * 0.6;
                this.alphaDir = Math.random() > 0.5 ? 0.008 : -0.008;
            }
            update() {
                this.angle += this.angleSpeed;
                this.x = canvas.width / 2 + this.baseX + this.offsetX + Math.sin(this.angle) * 6;
                this.y = canvas.height / 2 + this.baseY + this.offsetY + Math.cos(this.angle) * 6;
                this.alpha += this.alphaDir;
                if (this.alpha > 1 || this.alpha < 0.3) this.alphaDir *= -1;
            }
            draw() {
                ctx.font = `bold ${this.fontSize}px Montserrat, sans-serif`;
                ctx.fillStyle = `${this.baseColor}${this.alpha})`;
                ctx.shadowBlur = 6;
                ctx.shadowColor = "rgba(255, 215, 0, 0.6)";
                ctx.fillText(this.text, this.x, this.y);
                ctx.shadowBlur = 0;
            }
        }

        class YellowRose {
            constructor() { this.reset(true); }
            reset(init = false) {
                this.x = Math.random() * canvas.width;
                this.y = init ? Math.random() * (canvas.height + 100) - 50 : -50;
                this.fontSize = Math.floor(Math.random() * 18) + 16;
                this.speedY = Math.random() * 2 + 1.2;
                this.speedX = Math.random() * 1.2 - 0.6;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.03;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y / 25) * 0.6;
                this.angle += this.spin;
                if (this.y > canvas.height + 50 || this.x < -50 || this.x > canvas.width + 50) this.reset();
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.filter = "hue-rotate(60deg) brightness(1.3) saturate(1.5)";
                ctx.font = `${this.fontSize}px Arial`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.shadowBlur = 5;
                ctx.shadowColor = "rgba(255, 215, 0, 0.5)";
                ctx.fillText("🌹", 0, 0);
                ctx.restore();
            }
        }

        function init() {
            particles = Array.from({ length: isMobile ? 250 : 500 }, () => new Particle());
            roses = Array.from({ length: isMobile ? 50 : 100 }, () => new YellowRose());
        }

        window.addEventListener('resize', resize);
        resize();

        (function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            roses.forEach(r => { r.update(); r.draw(); });
            requestAnimationFrame(animate);
        })();
    </script>
</body>
</html>
